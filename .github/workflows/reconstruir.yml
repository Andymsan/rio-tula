name: Reconstruir el sitio cuando cambian los textos

# Se ejecuta solo cuando alguien guarda cambios en TEXTOS.md (o en el generador).
# Lee TEXTOS.md, regenera index.html y lo publica. Si hay un error en los textos,
# se detiene y NO cambia la página (el mensaje aparece en la pestaña "Actions").
on:
  push:
    branches: [main]
    paths:
      - 'TEXTOS.md'
      - 'tools/build_index.py'
      - 'tools/textos.py'
      - 'tools/fragmentos/historia_mapa.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generar index.html desde TEXTOS.md
        run: python tools/build_index.py

      - name: Guardar el resultado si cambió
        run: |
          git config user.name "Sitio Río Tula (automático)"
          git config user.email "actions@users.noreply.github.com"
          git add index.html img/fotos/LEEME.md
          if git diff --cached --quiet; then
            echo "Sin cambios: la página ya estaba al día."
          else
            git commit -m "Reconstruye el sitio desde TEXTOS.md [automático]"
            git push
          fi
